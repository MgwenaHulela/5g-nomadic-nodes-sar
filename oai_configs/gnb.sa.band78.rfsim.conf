Active_gNBs = ( "gnb-sar");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID    = 0xe00;
    gNB_name  = "gnb-sar";
    tracking_area_code = 1;
    plmn_list = ({ mcc = 999; mnc = 70; mnc_length = 2; snssaiList = ({ sst = 1 }) });
    nr_cellid = 12345678L;
    min_rxtxtime = 6;

    // CSI-RS / SRS enabled 2026-10-20. Both default to 0 in this OAI build,
    // and with CSI-RS off the UE has nothing to measure downlink quality
    // against: it reported CQI 0 (the "out of range" codepoint) on every
    // report despite seeing 45-51 dB SS-SINR with ZERO HARQ failures. The
    // gNB takes that at face value —
    //     sched_ctrl->dl_max_mcs = get_mcs_from_cqi(...)
    // — so link adaptation pinned MCS at 0-5 and the whole testbed topped
    // out near 9 Mb/s aggregate. That ceiling was never CPU, bandwidth or
    // the channel model; it was the scheduler believing a CQI of 0.
    // do_CSIRS is TYPE_INT (default 0). do_SRS is TYPE_STRING (default
    // "none") and rejects an integer — it is left alone here because SRS
    // sounds the UPLINK, while the problem being fixed is downlink CQI.
    do_CSIRS = 1;

    servingCellConfigCommon = (
    {
      physCellId                          = 0;
      absoluteFrequencySSB                = 621312;
      dl_absoluteFrequencyPointA          = 620040;
      dl_offstToCarrier                   = 0;
      dl_subcarrierSpacing                = 1;
      dl_carrierBandwidth                 = 106;
      initialDLBWPlocationAndBandwidth    = 28875;
      initialDLBWPsubcarrierSpacing       = 1;
      initialDLBWPcontrolResourceSetZero  = 11;
      initialDLBWPsearchSpaceZero         = 0;
      ul_frequencyBand                    = 78;
      ul_offstToCarrier                   = 0;
      ul_subcarrierSpacing                = 1;
      ul_carrierBandwidth                 = 106;
      pMax                                = 20;
      initialULBWPlocationAndBandwidth    = 28875;
      initialULBWPsubcarrierSpacing       = 1;
      prach_ConfigurationIndex            = 98;
      prach_msg1_FDM                      = 0;
      prach_msg1_FrequencyStart           = 0;
      zeroCorrelationZoneConfig           = 12;
      preambleReceivedTargetPower         = -104;
      preambleTransMax                    = 6;
      powerRampingStep                    = 1;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB    = 15;
      ra_ContentionResolutionTimer        = 7;
      rsrp_ThresholdSSB                   = 19;
      prach_RootSequenceIndex_PR          = 2;
      prach_RootSequenceIndex             = 1;
      msg1_SubcarrierSpacing              = 1;
      restrictedSetConfig                 = 0;
      msg3_DeltaPreamble                  = 1;
      p0_NominalWithGrant                 = -90;
      pucchGroupHopping                   = 0;
      hoppingId                           = 40;
      p0_nominal                          = -90;
      ssb_PositionsInBurst_Bitmap         = 1;
      ssb_periodicityServingCell          = 2;
      dmrs_TypeA_Position                 = 0;
      subcarrierSpacing                   = 1;
      referenceSubcarrierSpacing          = 1;
      dl_UL_TransmissionPeriodicity       = 6;
      nrofDownlinkSlots                   = 5;
      nrofDownlinkSymbols                 = 6;
      nrofUplinkSlots                     = 4;
      nrofUplinkSymbols                   = 4;
      ssPBCH_BlockPower                   = -25;
    }
    );

    SCTP = { SCTP_INSTREAMS = 2; SCTP_OUTSTREAMS = 2; };
    amf_ip_address = ({ ipv4 = "127.0.0.5"; });
    NETWORK_INTERFACES = {
      GNB_IPV4_ADDRESS_FOR_NG_AMF = "127.0.0.1";
      GNB_IPV4_ADDRESS_FOR_NGU    = "127.0.0.1";
      GNB_PORT_FOR_S1U            = 2152;
    };
  }
);

MACRLCs = (
  {
    tr_s_preference  = "local_L1";
    tr_n_preference  = "local_RRC";
    pusch_TargetSNRx10 = 200;
    pucch_TargetSNRx10 = 200;
  }
);

L1s = (
  {
    tr_n_preference   = "local_mac";
    prach_dtx_threshold = 200;
  }
);

RUs = (
  {
    local_rf       = "yes";
    nb_tx          = 1;
    nb_rx          = 1;
    att_tx         = 0;
    att_rx         = 0;
    bands          = [78];
    max_pdschReferenceSignalPower = -27;
    max_rxgain     = 75;
    eNB_instances  = [0];
  }
);

rfsimulator = (
  {
    serveraddr = "server";
    options = ("chanmod");
  }
);

channelmod = {
  max_chan = 10;
  modellist = "modellist_sar";
  modellist_sar = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -40;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -40;
      forgetfact     = 0.99;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue1";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -40;
      forgetfact     = 0.99;
      offset         = 0;
      ds_tdl         = 0;
    },
    // UE2 / UE3 added 2026-10-19 for the 4-robot testbed. modellist_sar
    // index order IS the channelmod index the bridge drives over telnet:
    // 0=enB0, 1=ue0(alpha), 2=ue1(bravo), 3=ue2(charlie), 4=ue3(delta).
    // max_chan = 10 leaves room; do not reorder these entries.
    {
      model_name     = "rfsimu_channel_ue2";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -40;
      forgetfact     = 0.99;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue3";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -40;
      forgetfact     = 0.99;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

security = {
  ciphering_algorithms  = ( "nea0" );
  integrity_algorithms  = ( "nia2", "nia0" );
  drb_ciphering         = "yes";
  drb_integrity         = "no";
};

log_config = {
  global_log_level = "info";
  // Was "debug" for both. That writes a line PER SYMBOL from inside the
  // rfsimulator RU thread — the single thread that is the testbed's
  // throughput bottleneck at ~99% of one core. It produced 1.6 GB and
  // 21.7 MILLION lines in one run, i.e. the bottleneck thread was spending
  // its budget on disk I/O rather than on samples. Keep MAC at info so the
  // periodic per-UE MCS/BLER stat block still prints (we read it to verify
  // link adaptation); PHY drops to error, which is what OAI uses for any
  // throughput measurement.
  mac_log_level    = "info";
  phy_log_level    = "error";
};

telnetsrv = {
  listenport = 9091;
  listenaddr = "127.0.0.1";
};
